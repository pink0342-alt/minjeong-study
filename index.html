<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3efff"><title>민정스터디</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<header><h1>민정스터디 📚</h1><small id="syncStatus">로컬 모드</small></header>
<main>
<section id="home" class="page active"><div class="hero card"><div>🔥 연속 학습<strong id="streak">0일</strong></div><div>오늘 학습<strong><span id="done">0</span>/<span id="goal">10</span></strong></div></div><button class="primary big" id="start">오늘 학습 시작</button><button id="extra">+ 10개 더 공부하기</button><div class="card"><h2>오늘만 학습량 변경</h2><div class="row"><input id="tempGoal" type="number" min="1" step="1"><button id="saveTemp">변경</button></div></div></section>
<section id="study" class="page"><div class="card center"><b id="kind"></b><div id="question"></div><button class="primary" id="reveal">정답/해설 보기</button><div id="answer" class="answer hidden"></div><div id="ratings" class="ratings hidden"><button data-r="again">😵 몰랐음</button><button data-r="hard">🤔 헷갈림</button><button data-r="good">😎 알았음</button></div></div><button id="stop">학습 종료</button></section>
<section id="library" class="page"><div class="tabs"><button class="tab active" data-tab="words">영단어</button><button class="tab" data-tab="wrong">오답노트</button></div>
<div id="words"><div class="card"><h2>영단어 등록</h2><input id="word" placeholder="영단어"><input id="meaning" placeholder="뜻"><input id="memo" placeholder="메모/헷갈리는 단어"><button class="primary" id="addWord">등록</button></div><div id="wordList"></div></div>
<div id="wrong" class="hidden"><div class="card"><h2>오답 등록</h2><select id="subject"><option>국어</option><option>영어</option><option>자료조직개론</option><option>정보봉사개론</option></select><label>문제 사진<input id="photo" type="file" accept="image/*"></label><input id="correct" placeholder="정답"><textarea id="explain" rows="4" placeholder="해설 / 틀린 이유"></textarea><button class="primary" id="addWrong">등록</button></div><div id="wrongList"></div></div></section>
<section id="settings" class="page"><div class="card"><h2>학습 설정</h2><label>기본 일일 학습량<input id="defaultGoal" type="number" min="1" step="1"></label><button class="primary" id="saveSettings">저장</button></div>
<div class="card"><h2>갤럭시 ↔ 아이패드 동기화</h2><input id="sbUrl" placeholder="Supabase Project URL"><input id="sbKey" placeholder="Supabase anon/publishable key"><input id="syncKey" type="password" placeholder="나만의 동기화 암호"><button class="primary" id="saveCloud">연결 정보 저장</button><button id="syncNow">지금 동기화</button><small>연결정보는 각 기기에만 저장돼요.</small></div>
<div class="card"><h2>백업</h2><button id="backup">백업 저장</button><label>백업 복원<input id="restore" type="file" accept=".json"></label></div></section>
</main><nav><button data-page="home" class="active">🏠<span>홈</span></button><button data-page="library">📚<span>단어·오답</span></button><button data-page="settings">⚙️<span>설정</span></button></nav><script src="app.js"></script></body></html>
